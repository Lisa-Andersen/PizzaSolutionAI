name: .NET

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore PizzaSolution.sln

      - name: Build solution
        run: dotnet build PizzaSolution.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PizzaSolution.sln --configuration Release --no-build --no-restore

      - name: Publish web application
        run: dotnet publish PizzaPlace/PizzaPlace.csproj --configuration Release --no-build --no-restore --output "${{ runner.temp }}/publish"

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: PizzaPlace-publish
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
